apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: main-server
  template:
    metadata:
      labels:
        app: main-server
    spec:
      containers:
        - name: express-cohort-2
          image: express_cohort_2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "128Mi" #RAM 128 megabytes
              cpu: "500m" # CPU millicores (0.5 CPU core) 1 core = 1000m (1000 millicores)
            requests:
              memory: "64Mi"
              cpu: "250m"
